<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DO2i 計算ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow" aria-hidden="true"></div>

    <main class="app-container">
        <header class="app-header">
            <div class="badge">
                <span class="pulse-dot"></span>
                <span>PERFUSION MONITOR</span>
            </div>
            <h1>DO2i 計算</h1>
            <p class="subtitle">Delivery of Oxygen Index Calculator</p>
        </header>

        <section class="card input-card" aria-label="入力項目">
            <div class="input-row">
                <label for="bsa">
                    <span class="label-ja">体表面積</span>
                    <span class="label-en">BSA</span>
                </label>
                <div class="input-box">
                    <input type="number" id="bsa" name="bsa" step="0.1" min="0" placeholder="0.0">
                    <span class="unit">m²</span>
                </div>
            </div>

            <div class="input-row">
                <label for="hematocrit">
                    <span class="label-ja">ヘマトクリット値</span>
                    <span class="label-en">Hct</span>
                </label>
                <div class="input-box">
                    <input type="number" id="hematocrit" name="hematocrit" min="0" max="100" step="0.1" placeholder="0">
                    <span class="unit">%</span>
                </div>
            </div>

            <div class="input-row">
                <label for="spo2">
                    <span class="label-ja">酸素飽和度</span>
                    <span class="label-en">SaO2</span>
                </label>
                <div class="input-box">
                    <input type="number" id="spo2" name="spo2" max="100" min="0" step="0.1" placeholder="100">
                    <span class="unit">%</span>
                </div>
            </div>

            <div class="input-row">
                <label for="pao2">
                    <span class="label-ja">動脈血酸素分圧</span>
                    <span class="label-en">PaO2</span>
                </label>
                <div class="input-box">
                    <input type="number" id="pao2" name="pao2" min="0" step="0.1" placeholder="0">
                    <span class="unit">mmHg</span>
                </div>
            </div>

            <div class="input-row">
                <label for="flow">
                    <span class="label-ja">灌流量</span>
                    <span class="label-en">Pump Flow</span>
                </label>
                <div class="input-box">
                    <input type="number" id="flow" name="flow" min="0" step="0.1" placeholder="0.0">
                    <span class="unit">L/min</span>
                </div>
            </div>

            <p class="error-message" id="spo2-error" role="alert"></p>

            <button type="button" class="calc-button" onclick="calculateDO2()">
                <span>CALCULATE DO2i</span>
            </button>
        </section>

        <section class="card result-card" id="result-card" aria-label="計算結果">
            <div class="result-top">
                <div class="result-header">
                    <h2>DO2i</h2>
                    <span class="result-unit">mL/min/m²</span>
                </div>
                <span class="status-pill" id="status-pill">READY</span>
            </div>

            <p id="do2-result" class="result-value" aria-live="polite">--</p>

            <div class="additional-info-container">
                <div class="additional-info-item">
                    <span class="temp-label">34℃ 基準</span>
                    <strong class="temp-value">280</strong>
                </div>
                <div class="additional-info-item">
                    <span class="temp-label">32℃ 基準</span>
                    <strong class="temp-value">270</strong>
                </div>
                <div class="additional-info-item">
                    <span class="temp-label">30℃ 基準</span>
                    <strong class="temp-value">260</strong>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
